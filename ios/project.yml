# XcodeGen spec — run `xcodegen generate` in this directory to produce
# Miles.xcodeproj (the project file is intentionally not checked in).
name: Miles
options:
  bundleIdPrefix: com.miles
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3.9"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: false
    # Set your Apple ID team here (free or paid) or pick it in Xcode's
    # Signing & Capabilities tab. Upgrading to a paid account is a signing
    # change only — no code changes required.
    # DEVELOPMENT_TEAM: XXXXXXXXXX
targets:
  Miles:
    type: application
    platform: iOS
    sources:
      - Miles
    info:
      path: Miles/Info.plist
      properties:
        CFBundleDisplayName: Miles
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.miles.sync
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          Miles detects your drives automatically in the background so every
          trip is logged for mileage deductions. Choose "Always Allow" —
          without it drives can't be detected when the app is closed.
        NSLocationWhenInUseUsageDescription: >-
          Miles uses your location to record drive routes and distances.
        NSMotionUsageDescription: >-
          Miles uses motion activity to detect when you start and stop
          driving, which keeps battery usage near zero between drives.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miles.tracker
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Miles/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
